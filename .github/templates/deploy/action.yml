name: Deploy

inputs:
  # Mainnet signs in through GitHub OIDC with AWS_ROLE_ARN. Testnet and integrationnet still pass an
  # access key pair. Give one or the other.
  AWS_ROLE_ARN:
    required: false
    default: ""
  AWS_ACCESS_KEY_ID:
    required: false
    default: ""
  AWS_SECRET_ACCESS_KEY:
    required: false
    default: ""
  AWS_REGION:
    required: true
  EC2_INSTANCE_1_ID:
    required: true
  EC2_INSTANCE_2_ID:
    required: true
  EC2_INSTANCE_3_ID:
    required: true
  GITHUB_TOKEN:
    required: true
  NETWORK:
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v3
    - name: Install AWS Cli
      uses: unfor19/install-aws-cli-action@v1
      with:
        arch: amd64
    - name: Install jq
      shell: bash
      run: |
        sudo apt install -y jq

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.AWS_ROLE_ARN }}
        aws-access-key-id: ${{ inputs.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ inputs.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ inputs.AWS_REGION }}

    - name: Filling EC2 instances information
      env:
        NETWORK: ${{ inputs.NETWORK }}
      shell: bash
      run: |
        echo "EC2_INSTANCE_1_ID=${{ inputs.EC2_INSTANCE_1_ID }}" >> $GITHUB_ENV
        echo "EC2_INSTANCE_2_ID=${{ inputs.EC2_INSTANCE_2_ID }}" >> $GITHUB_ENV
        echo "EC2_INSTANCE_3_ID=${{ inputs.EC2_INSTANCE_3_ID }}" >> $GITHUB_ENV
        echo "BUCKET_NAME=dor-metagraph-jars-$NETWORK" >> $GITHUB_ENV

    - name: Validate S3 bucket
      shell: bash
      run: |
        if ! aws s3 ls "s3://$BUCKET_NAME" 2>/dev/null; then
          aws s3api create-bucket --bucket "$BUCKET_NAME" --region ${{ inputs.AWS_REGION }} --create-bucket-configuration LocationConstraint=${{ inputs.AWS_REGION }}
          echo "Bucket '$BUCKET_NAME' created successfully"
        else
          echo "Bucket '$BUCKET_NAME' already exists."
        fi



    - name: Get Metagraph JARS on Github
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
      run: |
        METAGRAPH_VERSION=$(grep -o 'version := "[^"]*' metagraph/version.sbt | cut -d'"' -f2)
        mkdir .github/artifacts
        cd .github/artifacts
        
        echo "Getting the metagraph JARs on Github of version $METAGRAPH_VERSION"
        wget https://github.com/Constellation-Labs/dor-metagraph/releases/download/v$METAGRAPH_VERSION/metagraph-l0.jar
        wget https://github.com/Constellation-Labs/dor-metagraph/releases/download/v$METAGRAPH_VERSION/currency-l1.jar
        wget https://github.com/Constellation-Labs/dor-metagraph/releases/download/v$METAGRAPH_VERSION/data-l1.jar

    - name: Send JARs to S3 bucket
      shell: bash
      env:
        NETWORK: ${{ inputs.NETWORK }}
      run: |
        cd .github/artifacts
        aws s3 cp metagraph-l0.jar s3://dor-metagraph-jars-$NETWORK
        aws s3 cp data-l1.jar s3://dor-metagraph-jars-$NETWORK
        aws s3 cp currency-l1.jar s3://dor-metagraph-jars-$NETWORK

    # Each node downloads its JARs over a presigned URL that expires in 15 minutes, so no AWS
    # credentials are sent to the nodes or kept in the SSM command history.
    - name: Send JARs from S3 to EC2 instances
      shell: bash
      run: |
        instance_number=0
        for instance_id in "$EC2_INSTANCE_1_ID" "$EC2_INSTANCE_2_ID" "$EC2_INSTANCE_3_ID"; do
          instance_number=$((instance_number + 1))
          for jar in metagraph-l0 currency-l1 data-l1; do
            url=$(aws s3 presign "s3://$BUCKET_NAME/$jar.jar" --expires-in 900)
            download="command -v curl > /dev/null || (apt-get update -y && apt-get install -y curl); curl -fsSL --retry 3 -o /home/ubuntu/code/$jar/$jar.jar '$url'"

            command_id=$(aws ssm send-command \
              --instance-ids "$instance_id" \
              --document-name "AWS-RunShellScript" \
              --comment "dor-metagraph deploy: $jar" \
              --parameters "$(jq -nc --arg c "$download" '{commands: [$c]}')" \
              --query "Command.CommandId" \
              --output text)

            aws ssm wait command-executed --instance-id "$instance_id" --command-id "$command_id" || true

            exit_code=$(aws ssm get-command-invocation \
              --instance-id "$instance_id" \
              --command-id "$command_id" \
              --query "ResponseCode" \
              --output text)

            if [ "$exit_code" = "0" ]; then
              echo "$jar JAR uploaded successfully - Instance $instance_number"
            else
              echo "Failure when uploading $jar JAR - Instance $instance_number (exit code $exit_code)"
              exit 1
            fi
          done
        done

    - name: Save Metagraph L0 JAR
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: metagraph-l0.jar
        path: .github/artifacts/metagraph-l0.jar
    - name: Save Currency L1 JAR
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: currency-l0.jar
        path: .github/artifacts/currency-l1.jar
    - name: Save Data L1 JAR
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: data-l1.jar
        path: .github/artifacts/data-l1.jar